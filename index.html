<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>packraven</title>
    <!-- We set the theme before the first paint, so dark mode doesn't flash the light canvas while the app loads. -->
    <script>
      try {
        const stored = localStorage.getItem('packraven-theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
    <style>
      html { background: #f7f5ef; }
      html[data-theme='dark'] { background: #1a1d17; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
