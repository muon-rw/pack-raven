[package]
name = "packraven"
version = "0.1.0"
description = "Release console for CurseForge modpacks"
authors = ["muon-rw"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "packraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.104"
toml = "1.1.8"
globset = "0.4.20"
regex = "1.13.1"
walkdir = "2.5.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["full"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "rustls", "query"] }
