[package]
name = "packraven"
version = "0.3.4"
description = "Release console for CurseForge modpacks"
authors = ["muon-rw"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "packraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
anyhow = "1.0.104"
toml = "1.1.8"
globset = "0.4.20"
regex = "1.13.1"
walkdir = "2.5.0"
sha1 = "0.11.0"
hex = "0.4.3"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["full"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "rustls", "query", "form"] }
notify = "8.2.0"
base64 = "0.23.1"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.11.1"
getrandom = "0.3.4"
clipboard-rs = { version = "0.3.5", default-features = false }
trash = "5.2.9"
flate2 = "1.1.10"
tar = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-updater = "2"

[target."cfg(not(windows))".dependencies]
drag = "2.1.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
winreg = "0.56.0"
